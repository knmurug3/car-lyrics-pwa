<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111214" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CarLyrics" />

  <title>CarLyrics</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/spotify--v1.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="style.css?v=11" />
</head>
<body>
  <!-- Ambient album background -->
  <div id="ambient-bg" aria-hidden="true"></div>
  <div id="ambient-overlay" aria-hidden="true"></div>

  <div id="app">
    <!-- Now playing: top bar on phones, side panel on landscape screens -->
    <aside class="now-playing">
      <img id="album-art" class="album-art" src="https://img.icons8.com/color/512/spotify--v1.png" alt="Album art" />

      <div class="meta">
        <div id="track-title" class="track-title">CarLyrics</div>
        <div id="artist-name" class="artist-name">Live lyrics for the passenger seat</div>
      </div>

      <div class="progress">
        <div class="progress-bar" aria-hidden="true">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-times">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="controls">
        <div id="status-badge" class="status-badge" hidden>
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Idle</span>
        </div>
        <button id="login-btn" class="btn btn-primary">Connect<span class="wide-only"> Spotify</span></button>
        <button id="qr-btn" class="btn btn-quiet" title="Let passengers follow along">Share</button>
        <button id="menu-btn" class="btn btn-quiet" aria-haspopup="dialog">Menu</button>
      </div>
    </aside>

    <!-- Synced lyrics -->
    <section class="lyrics-pane">
    <main id="lyrics-container">
      <div class="state-message welcome">
        <h1>Lyrics that keep up with the road</h1>
        <p>Connect Spotify and every song shows up here, synced and in English letters.</p>
        <div class="welcome-actions">
          <button id="demo-btn" class="btn btn-outline">Try a demo song</button>
          <button id="copy-uri-btn" class="btn btn-link" title="For setting up your own Spotify developer app">Copy redirect URI</button>
        </div>
      </div>
    </main>

      <!-- Per-song timing nudge for lyrics that run early or late -->
      <div id="timing" class="timing" hidden>
        <button id="timing-later" class="timing-btn" title="Show lyrics later">Later</button>
        <span id="timing-value" class="timing-value">Early 0.5s</span>
        <button id="timing-earlier" class="timing-btn" title="Show lyrics earlier">Earlier</button>
      </div>

      <!-- Unsynced lyrics: start tap-to-sync (stays visible while the lyrics scroll) -->
      <button id="sync-start" class="btn btn-quiet floating-action" hidden>Sync along</button>

      <!-- Tap-to-sync controls for unsynced lyrics -->
      <div id="sync-bar" class="sync-bar" hidden>
        <span id="sync-progress" class="sync-progress">Line 1</span>
        <button id="sync-undo" class="btn btn-quiet">Undo</button>
        <button id="sync-cancel" class="btn btn-link">Cancel</button>
        <button id="sync-tap" class="btn btn-primary sync-tap">Tap when this line starts</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Passenger QR Modal -->
  <div id="qr-modal" class="modal-overlay">
    <div class="modal-content" role="dialog" aria-labelledby="qr-title">
      <h3 id="qr-title">Share with passengers</h3>
      <p id="qr-text"></p>
      <div id="qr-code" class="qr-code" role="img" aria-label="QR code to follow this drive"></div>
      <button id="close-qr-btn" class="btn btn-primary btn-block">Done</button>
      <button id="stop-share-btn" class="btn btn-link btn-block" hidden>Stop sharing</button>
    </div>
  </div>

  <!-- Menu: text size, full screen, lyrics library, sharing, account -->
  <div id="menu-modal" class="modal-overlay menu-overlay">
    <div class="menu-sheet" role="dialog" aria-labelledby="menu-title">
      <div class="menu-head">
        <h3 id="menu-title">Menu</h3>
        <button id="close-menu-btn" class="btn btn-quiet">Close</button>
      </div>
      <div id="menu-body" class="menu-body"></div>
    </div>
  </div>

  <script src="vendor/sanscript.min.js?v=11"></script>
  <script src="vendor/qrcode.min.js?v=11"></script>
  <script src="vendor/nosleep.min.js?v=11"></script>
  <script type="module">
    import anyAscii from './vendor/any-ascii.mjs?v=11';
    window.anyAscii = anyAscii;
  </script>
  <script src="lib/lyrics-engine.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
